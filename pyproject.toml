[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcy"
version = "1.0.0"
description = "A breakbeat loop slicer and SFZ exporter inspired by jungle and drum & bass culture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RCY Contributors"}
]
keywords = ["audio", "breakbeat", "sampling", "sfz", "jungle", "drum-and-bass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Runtime imports found in src/python, tools/bin and tests. Transitive
# packages (scipy, numba, soxr, audioread, joblib, ...) come in via librosa
# and textual and are not listed here.
dependencies = [
    "numpy>=2.0.2",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "sounddevice>=0.5.0",
    "midiutil>=1.2.1",
    "mido>=1.3.2",
    "textual>=0.89.0",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# MIDI hardware backend for mido (S2800, EP-133, MPC2000XL over a MIDI interface).
hardware = [
    "python-rtmidi>=1.5.0",
]
# Google ADK agent server (`just agent-start`, s2800.agent.agent).
agent = [
    "google-adk>=1.0.0",
    "python-dotenv>=1.0.0",
]
# OpenRouter LLM agent inside the TUI (tui.agents.openrouter).
llm = [
    "pydantic-ai>=0.0.24",
    "python-dotenv>=1.0.0",
    "nest-asyncio>=1.5.0",
]
# Plotting for tools/bin/audio-viz and audio-trim --plot.
viz = [
    "matplotlib>=3.9.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/tnn1t1s/rcy"
Repository = "https://github.com/tnn1t1s/rcy"
Issues = "https://github.com/tnn1t1s/rcy/issues"

[project.scripts]
rcy = "tui.app:main"
rcy-export = "utils.export_cli:main"
rcy-onsets = "utils.onsets_cli:main"
rcy-sfz = "utils.sfz.generate_sfz:main"
rcy-midi-analyzer = "utils.midi_analyzer:main"
rcy-s2800 = "s2800.cli:main"
rcy-s2800-agent = "s2800.agent.__main__:main"
rcy-mpc = "mpc2000xl.cli:main"

# Modules live flat under src/python so imports stay `from s2800 import S2800`.
[tool.setuptools]
package-dir = {"" = "src/python"}
py-modules = [
    "audio_processor",
    "audio_utils",
    "beat_grid",
    "commands",
    "config_manager",
    "custom_types",
    "cut_list",
    "enums",
    "error_handler",
    "export_utils",
    "kit_manifest",
    "logging_config",
    "onsets",
    "ring_buffer_audio",
    "segment_manager",
    "sfz_writers",
    "timestretch",
    "view_state",
]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.setuptools.package-data]
"tui" = ["*.tcss"]
"s2800.agent" = ["*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/python"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "RUF",   # Ruff-specific rules
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "S101",    # Use of assert detected (pytest uses assert)
    "T201",    # print found (allow print statements for now)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]  # Allow assert and skip annotations in tests
"test_*.py" = ["S101", "ANN"]      # Allow assert and skip annotations in tests

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "sounddevice.*",
    "soundfile.*",
    "midiutil.*",
    "mido.*",
    "pyrubberband.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m", "not ep133 and not s2800",
]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ep133: EP-133 integration tests (require device connected)",
    "s2800: S2800 integration tests (require device connected via MIDI)",
]

[tool.coverage.run]
source = ["src/python"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
