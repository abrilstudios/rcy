name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-and-export:
    name: SDK tests and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SDK tests
        run: node --test "test/*.test.ts"
        working-directory: rcy-sdk
      - name: Programs embed the SDK build the specs pin
        run: |
          python3 bin/check-sdk export/rcy-export
          python3 bin/check-sdk --spec WINDOW.md window/rcy-window
      - name: Committed programs are what the sources build
        run: |
          node rcy-sdk/bin/build.cjs
          node rcy-sdk/dist/bundle.cjs export/main.js export/rcy-export
          node rcy-sdk/dist/bundle.cjs window/main.js window/rcy-window
          git diff --exit-code
      - name: Cut a preset
        env:
          RCY_PRESETS: ${{ github.workspace }}/presets
        run: |
          node export/rcy-export --preset amen_classic --out "$RUNNER_TEMP/amen" --exs --buffer-ms 20
          test -s "$RUNNER_TEMP/amen/016.wav"
          test -s "$RUNNER_TEMP/amen/amen.rcy.json"

  hardware:
    name: Hardware tools, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project hardware rcy-s2800-agent param ZPLAY1
      - run: uv run --project hardware rcy-s2800 --help
      - run: uv run --project hardware rcy-mpc --help
